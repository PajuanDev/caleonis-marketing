name: Caleonis embedded upstream studio
on:
  push:
    branches: [feat/marketing-workspace-v1]
    paths: ['var/caleonis/upstream-studio/embedded/**', 'apps/frontend/src/caleonis/studio-channel.mjs', 'apps/frontend/src/caleonis/embedded-studio.component.tsx', 'apps/frontend/src/app/**/media/studio/**', 'libraries/helpers/src/caleonis/workspace.domain.ts', '.github/workflows/caleonis-embedded-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: embedded-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.20.0'}
      - name: Test channel and actual server validation without provider calls
        run: node --experimental-strip-types --test var/caleonis/upstream-studio/embedded/channel.test.mjs var/caleonis/upstream-studio/embedded/persistence.test.mjs
      - name: Retrieve the original pinned studio and its locked dependencies
        run: |
          git submodule update --init --depth 1 -- vendor/open-higgsfield
          test "$(git -C vendor/open-higgsfield rev-parse HEAD)" = 1df1148e46d1b47d29e117b7bb1971a65c4286ee
          cd vendor/open-higgsfield
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile original controls and galleries for the Caléonis host
        run: |
          npm install --prefix var/caleonis/upstream-studio/embedded --ignore-scripts --no-audit --no-fund
          CALEONIS_STUDIO_BUILD_FIXTURE=isolated node var/caleonis/upstream-studio/embedded/build.mjs vendor/open-higgsfield /tmp/caleonis-embedded-assets
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install isolated browser tooling
        run: |
          mkdir -p /tmp/caleonis-embedded-browser /tmp/caleonis-embedded-evidence
          cd /tmp/caleonis-embedded-browser
          npm init -y
          npm install --no-audit --no-fund agent-browser@0.38.1 @playwright/test@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real controls, project persistence and fail-closed access
        env:
          CALEONIS_STUDIO_FIXTURE: isolated
        run: |
          set -euo pipefail
          readonly AB=/tmp/caleonis-embedded-browser/node_modules/.bin/agent-browser
          readonly OUT=/tmp/caleonis-embedded-evidence
          node var/caleonis/upstream-studio/embedded/fixture.mjs /tmp/caleonis-embedded-assets > "$OUT/server.log" 2>&1 &
          SERVER_PID=$!
          trap '$AB close || true; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4318/caleonis-studio/index.html -o /dev/null; then break; fi
            sleep 1
          done
          CHROMIUM=$(cd /tmp/caleonis-embedded-browser && node -p 'require("@playwright/test").chromium.executablePath()')
          $AB --executable-path "$CHROMIUM" open http://127.0.0.1:4318/fixture-host.html
          $AB wait --fn '!!document.querySelector("iframe")?.contentDocument?.querySelector("textarea")'
          $AB snapshot -i > "$OUT/host-snapshot.txt"
          $AB screenshot "$OUT/host-loaded.png"
          $AB close
          node var/caleonis/upstream-studio/embedded/browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caleonis-embedded-studio-evidence
          path: |
            /tmp/caleonis-embedded-evidence
            /tmp/caleonis-embedded-assets/build-info.json
          retention-days: 3
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: ci-local-only, POSTGRES_DB: caleonis_workspace_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/caleonis_workspace_test
      CALEONIS_TEST_DB: isolated
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.20.0'}
      - name: Install isolated database dependencies
        run: |
          mkdir -p /tmp/caleonis-studio-db
          cd /tmp/caleonis-studio-db
          npm init -y
          npm install --no-audit --no-fund prisma@6.5.0 @prisma/client@6.5.0
          ln -s /tmp/caleonis-studio-db/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Initialize disposable schema and test persisted studio choices
        run: |
          node_modules/.bin/prisma generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          node_modules/.bin/prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          node --experimental-strip-types --test var/caleonis/upstream-studio/embedded/persistence-db.test.mjs
