name: Build
on:
  push:
  merge_group:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Test creative transport and job isolation without external calls
        run: node --experimental-strip-types --test var/caleonis/higgsfield.test.mjs
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.1'
          run_install: false
      - name: Install dependencies
        run: NODE_ENV=development pnpm install --frozen-lockfile
      - name: Test cookie isolation and branding
        run: node --experimental-strip-types --test var/caleonis/cookie-domain.test.mjs var/caleonis/brand-routes.test.mjs
      - name: Build frontend, backend and orchestrator
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: '1'
