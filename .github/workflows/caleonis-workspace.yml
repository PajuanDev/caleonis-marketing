name: Caleonis workspace safety
on:
  push:
    branches: [feat/marketing-workspace-v1]
  pull_request:
    paths: ['**/caleonis/**', '.github/workflows/caleonis-workspace.yml']
permissions:
  contents: read
concurrency:
  group: workspace-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.20.0'}
      - run: node --experimental-strip-types --test var/caleonis/workspace.test.mjs var/caleonis/native-image.test.mjs
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: caleonis_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/caleonis_workspace_test
      CALEONIS_TEST_DB: isolated
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.20.0'}
      - name: Install only isolated database test dependencies
        run: |
          mkdir -p /tmp/caleonis-db-test
          cd /tmp/caleonis-db-test
          npm init -y
          npm install --no-audit --no-fund prisma@6.5.0 @prisma/client@6.5.0
          ln -s /tmp/caleonis-db-test/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Initialize disposable upstream schema
        run: |
          node_modules/.bin/prisma generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          node_modules/.bin/prisma db push --skip-generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
      - name: Test persistence, tenant boundaries and concurrent reservations
        run: node --experimental-strip-types --test var/caleonis/workspace-db.test.mjs
      - name: Verify existing seeded records survive upstream db push
        run: node --experimental-strip-types --test var/caleonis/workspace-upstream-compat.test.mjs
