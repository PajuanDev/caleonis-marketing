user www;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 100M;
  map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
  server {
    listen 5000;
    listen [::]:5000;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /healthz { proxy_pass http://127.0.0.1:5001/healthz; proxy_read_timeout 6s; }
    location /api/ {
      proxy_pass http://127.0.0.1:3000/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection '';
    }
    location /uploads/ {
      alias /uploads/;
      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
      types { image/jpeg jpg jpeg; image/png png; image/gif gif; image/webp webp; image/avif avif; video/mp4 mp4; video/webm webm; }
      default_type application/octet-stream;
    }
    location / {
      proxy_pass http://127.0.0.1:4200/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection '';
    }
  }
}
